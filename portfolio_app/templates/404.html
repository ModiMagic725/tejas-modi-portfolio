{% load static %}<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#04060c" />
    <title>Oops! Page not found · Tejas Modi</title>

    <link rel="icon" href="{% static 'assets/favicon/favicon.ico' %}" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="{% static 'assets/favicon/favicon.svg' %}" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #04060c;
        --tx: #e9ecf5;
        --mut: #8b93b0;
        --ac: #22d3b6;
        --ac-rgb: 34, 211, 182;
        --pu: #a78bfa;
        --pu-rgb: 167, 139, 250;
        --bd: rgba(255, 255, 255, 0.12);
        --e: cubic-bezier(0.22, 0.8, 0.2, 1);
        color-scheme: dark;
        box-sizing: border-box;
      }
      *, *:before, *:after { box-sizing: inherit; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font: 400 16px/1.6 Inter, system-ui, sans-serif;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
        overflow-x: hidden;
        position: relative;
      }
      /* soft glow behind the card */
      body:before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background:
          radial-gradient(45% 40% at 80% 15%, rgba(var(--pu-rgb), 0.2), transparent 70%),
          radial-gradient(45% 40% at 15% 85%, rgba(var(--ac-rgb), 0.16), transparent 70%);
      }
      a { color: inherit; text-decoration: none; }
      :focus-visible { outline: 2px solid var(--ac); outline-offset: 3px; border-radius: 8px; }

      .nf {
        width: 100%;
        max-width: 620px;
        text-align: center;
        padding: clamp(28px, 6vw, 52px) clamp(20px, 5vw, 44px);
        border: 1px solid var(--bd);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.7);
        animation: rise 0.7s var(--e) both;
      }

      .emoji {
        display: inline-block;
        font-size: clamp(64px, 16vw, 96px);
        line-height: 1;
        cursor: pointer;
        user-select: none;
        background: none;
        border: 0;
        padding: 0;
        animation: float 4s ease-in-out infinite;
        filter: drop-shadow(0 12px 24px rgba(var(--pu-rgb), 0.35));
      }
      .code {
        margin: 6px 0 0;
        font: 700 clamp(72px, 20vw, 132px)/1 "Space Grotesk", sans-serif;
        letter-spacing: -0.04em;
        background: linear-gradient(120deg, var(--ac), var(--pu));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 {
        margin: 4px 0 10px;
        font: 700 clamp(1.5rem, 4.5vw, 2.1rem)/1.2 "Space Grotesk", sans-serif;
      }
      p { margin: 0; color: var(--mut); }

      .typed {
        margin: 22px auto 0;
        max-width: 100%;
        text-align: left;
        border: 1px dashed var(--bd);
        border-radius: 14px;
        padding: 12px 16px;
        background: rgba(0, 0, 0, 0.25);
      }
      .typed small {
        display: block;
        font-size: 0.74rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--mut);
        margin-bottom: 2px;
      }
      .typed code {
        display: block;
        font: 500 0.95rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: var(--ac);
        word-break: break-all;
      }

      .actions { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 24px;
        border-radius: 99px;
        border: 1px solid var(--bd);
        background: transparent;
        color: var(--tx);
        font: 500 0.95rem Inter, sans-serif;
        cursor: pointer;
        transition: transform 0.3s var(--e), border-color 0.3s, background 0.3s;
      }
      .btn:hover { transform: translateY(-2px); border-color: rgba(var(--ac-rgb), 0.6); }
      .btn-main { background: var(--ac); border-color: var(--ac); color: #04060c; font-weight: 600; }
      .btn-main:hover { background: #4ae3c9; border-color: #4ae3c9; }

      @keyframes float { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-14px) rotate(4deg); } }
      @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        .nf, .emoji { animation: none; }
        .btn { transition: none; }
      }
    </style>
  </head>
  <body>
    <main class="nf" id="main">
      <button type="button" class="emoji" id="emoji" aria-label="Change emoji" title="Click me!">🛸</button>
      <div class="code" aria-hidden="true">404</div>
      <h1>Oops! Page not found</h1>
      <p>The page you are looking for doesn't exist, was moved, or the link has a typo.</p>

      <div class="typed">
        <small>You typed</small>
        <code>{{ request.path }}</code>
      </div>

      <div class="actions">
        <a class="btn btn-main" href="{% url 'home' %}">🏠 Back to home</a>
        <a class="btn" href="{% url 'start_a_project' %}">🚀 Start a project</a>
        <button type="button" class="btn" onclick="history.length > 1 ? history.back() : (location.href = '{% url 'home' %}')">↩ Go back</button>
      </div>
    </main>

    <script>
      // little easter egg: click the emoji to change it
      (function () {
        var faces = ["🛸", "🙈", "🧭", "🔍", "👻", "🪐"];
        var i = 0;
        var el = document.getElementById("emoji");
        el.addEventListener("click", function () {
          i = (i + 1) % faces.length;
          el.textContent = faces[i];
        });
      })();
    </script>
  </body>
</html>
