{# Styles for the dashboard home (scoped under .db). Include once in dashboard.html. #}
<style>
.db{--db-line:var(--line,rgba(128,128,128,.28));--db-soft:rgba(128,128,128,.08);--db-ease:cubic-bezier(.2,.8,.2,1);
  --db-blue:#3b6ef5;--db-violet:#8b5cf6;--db-teal:#0d9488;--db-amber:#f59e0b;--db-red:#dc2626;--db-green:#16a34a;
  display:grid;gap:18px;margin-bottom:18px}
.db .card{margin:0}

/* One page-load moment: blocks settle in, bars and pipeline fill */
@keyframes db-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes db-grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes db-fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.db > *{animation:db-in .5s var(--db-ease) both}
.db > :nth-child(2){animation-delay:.07s}
.db > :nth-child(3){animation-delay:.14s}

/* ---------- Stat cards ---------- */
.db-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.db-stat{--sec:#3b6ef5;--sec2:#06b6d4;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:4px;padding:18px 16px 14px;
  border:1px solid color-mix(in srgb,var(--sec) 28%,var(--db-line));border-radius:14px;color:inherit;text-decoration:none;
  background:linear-gradient(180deg,color-mix(in srgb,var(--sec) 8%,transparent),transparent 90px);
  transition:transform .2s var(--db-ease),box-shadow .25s,border-color .25s}
.db-stat.tone-2{--sec:#8b5cf6;--sec2:#d946ef}
.db-stat.tone-3{--sec:#0d9488;--sec2:#22c55e}
.db-stat.tone-4{--sec:#f59e0b;--sec2:#ef4444}
.db-stat.tone-5{--sec:#ec4899;--sec2:#f43f5e}
.db-stat::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--sec),var(--sec2))}
.db-stat:hover{transform:translateY(-3px);border-color:var(--sec);box-shadow:0 10px 26px color-mix(in srgb,var(--sec) 22%,transparent)}
.db-stat:focus-visible{outline:3px solid color-mix(in srgb,var(--sec) 45%,transparent);outline-offset:2px}
.db-stat.hot{border-color:color-mix(in srgb,var(--sec) 65%,transparent)}
.db-stat-top{display:flex;align-items:center;gap:10px}
.db-stat-ic{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;color:#fff;
  background:linear-gradient(135deg,var(--sec),var(--sec2));box-shadow:0 5px 12px color-mix(in srgb,var(--sec) 35%,transparent)}
.db-stat-ic .ic{width:18px;height:18px}
.db-stat-l{font-size:.86rem;font-weight:600;opacity:.8}
.db-stat-n{margin-top:6px;font-size:2rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.db-stat-n small{font-size:1rem;font-weight:500;opacity:.5}
.db-stat-f{font-size:.8rem;opacity:.65}
.db-delta{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:.78rem;font-weight:600}
.db-delta::before{content:"";width:8px;height:8px;background:currentColor;clip-path:polygon(50% 0,100% 100%,0 100%)}
.db-delta.up{color:var(--db-green)}
.db-delta.down{color:var(--db-red)}
.db-delta.down::before{transform:rotate(180deg)}
.db-delta.flat{opacity:.6}
.db-delta.flat::before{height:2px;clip-path:none}

/* ---------- Rows ---------- */
.db-row{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
.db-card .card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.db-count{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 8px;margin-left:6px;border-radius:999px;
  font-size:.78rem;font-weight:700;color:#fff;background:linear-gradient(135deg,#f59e0b,#ef4444);vertical-align:2px}

/* ---------- Needs attention ---------- */
.db-attn{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.db-attn li{--lv:#3b6ef5;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;
  border:1px solid color-mix(in srgb,var(--lv) 28%,var(--db-line));border-left:4px solid var(--lv);
  background:color-mix(in srgb,var(--lv) 6%,transparent);transition:background .2s,transform .2s var(--db-ease)}
.db-attn li:hover{background:color-mix(in srgb,var(--lv) 11%,transparent);transform:translateX(2px)}
.db-attn li.lv-bad{--lv:#dc2626}
.db-attn li.lv-warn{--lv:#d97706}
.db-attn li.lv-info{--lv:#3b6ef5}
.db-lv{padding:2px 10px;border-radius:999px;font-size:.74rem;font-weight:700;color:var(--lv);background:color-mix(in srgb,var(--lv) 14%,transparent);white-space:nowrap}
.db-attn-t{font-size:.9rem;line-height:1.4}
.db-ok{display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 12px;text-align:center}
.db-ok .ic{width:44px;height:44px;padding:11px;border-radius:50%;color:#fff;background:linear-gradient(135deg,#16a34a,#22c55e);box-shadow:0 8px 18px rgba(22,163,74,.3);fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.db-ok p{margin:4px 0 0;font-weight:600}
.db-ok small{opacity:.65}

/* ---------- Requirement pipeline ---------- */
.db-pipe{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.db-pipe li{--c:#3b6ef5;display:grid;grid-template-columns:92px minmax(0,1fr) 28px;align-items:center;gap:12px;font-size:.88rem}
.db-pipe li.st-new{--c:#3b6ef5}
.db-pipe li.st-reviewing{--c:#8b5cf6}
.db-pipe li.st-discussing{--c:#d946ef}
.db-pipe li.st-approved{--c:#0d9488}
.db-pipe li.st-in_progress{--c:#f59e0b}
.db-pipe li.st-completed{--c:#16a34a}
.db-pipe-bar{height:12px;border-radius:999px;background:var(--db-soft);overflow:hidden}
.db-pipe-bar i{display:block;height:100%;width:var(--w);min-width:0;border-radius:999px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 65%,#fff));
  transform-origin:left;animation:db-fill .7s var(--db-ease) both;animation-delay:calc(var(--i) * 70ms + .25s)}
.db-pipe b{text-align:right;font-variant-numeric:tabular-nums}
.db-note{margin:14px 0 0;font-size:.8rem;opacity:.6}

/* ---------- 30-day chart ---------- */
.db-legend{display:flex;gap:16px;font-size:.84rem}
.db-legend span{display:inline-flex;align-items:center;gap:7px}
.db-legend span::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--db-blue)}
.db-legend .lg-r::before{background:var(--db-violet)}
.db-legend b{font-variant-numeric:tabular-nums}
.db-chart{position:relative;padding-left:30px}
.db-ymax{position:absolute;left:0;top:-6px;font-size:.72rem;opacity:.55;font-variant-numeric:tabular-nums}
.db-bars{display:flex;align-items:flex-end;gap:4px;height:170px;border-bottom:1px solid var(--db-line);
  background:repeating-linear-gradient(to top,transparent 0,transparent calc(25% - 1px),var(--db-soft) calc(25% - 1px),var(--db-soft) 25%)}
.db-day{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;gap:1px;border-radius:4px;transition:background .15s}
.db-day:hover{background:var(--db-soft)}
.db-day span{flex:1;min-width:2px;border-radius:3px 3px 0 0;transform-origin:bottom;animation:db-grow .55s var(--db-ease) both;animation-delay:calc(var(--i) * 14ms + .3s)}
.db-day .m{background:linear-gradient(180deg,#3b6ef5,#06b6d4)}
.db-day .r{background:linear-gradient(180deg,#8b5cf6,#d946ef)}
.db-xaxis{display:flex;justify-content:space-between;margin-top:8px;font-size:.74rem;opacity:.6}

@media (max-width:900px){.db-row{grid-template-columns:1fr}}
@media (max-width:560px){
  .db-attn li{grid-template-columns:1fr auto}
  .db-lv{grid-column:1/-1;justify-self:start}
  .db-pipe li{grid-template-columns:78px minmax(0,1fr) 24px}
}
@media (prefers-reduced-motion:reduce){
  .db,.db *,.db *::before,.db *::after{animation:none!important;transition:none!important}
}
</style>
